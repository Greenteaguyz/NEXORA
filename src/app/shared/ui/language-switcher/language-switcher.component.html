<div class="lang-segmented-group" role="group" aria-label="Language selection">
  <button 
    type="button" 
    class="lang-segment-btn" 
    [class.active]="translationService.activeLang() === 'en'"
    [attr.aria-pressed]="translationService.activeLang() === 'en'"
    (click)="setLanguage('en')">
    EN
  </button>
  <button 
    type="button" 
    class="lang-segment-btn" 
    [class.active]="translationService.activeLang() === 'kh'"
    [attr.aria-pressed]="translationService.activeLang() === 'kh'"
    (click)="setLanguage('kh')">
    KH
  </button>
</div>
