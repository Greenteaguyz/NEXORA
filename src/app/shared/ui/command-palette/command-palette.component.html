@if (isOpen()) {
  <div class="cmd-backdrop" appScrollLock (click)="close()" role="dialog" aria-modal="true" aria-label="Game & Store Search Palette">
    <div class="cmd-dialog" (click)="$event.stopPropagation()">
      <!-- Search Header -->
      <div class="cmd-header">
        <svg class="cmd-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        <input
          #searchInput
          type="text"
          class="cmd-search-input"
          [placeholder]="t()('cmd.search_placeholder')"
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          aria-label="Command search query"
        />

        <!-- Desktop Escape Hint -->
        <kbd class="cmd-badge-hint desktop-only">ESC</kbd>

        <!-- Mobile Touch Close Button -->
        <button 
          type="button" 
          class="cmd-btn-close mobile-only" 
          (click)="close()" 
          aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Results List -->
      <div class="cmd-results" role="listbox">
        @if (filteredItems().length === 0) {
          <div class="cmd-empty">
            <span class="cmd-empty-title">No games or results found</span>
            <span class="cmd-empty-subtitle">Try searching for "Action", "Cyberpunk", or a game title.</span>
          </div>
        } @else {
          @for (item of filteredItems(); track item.id; let idx = $index) {
            <button
              type="button"
              class="cmd-item"
              [class.selected]="idx === selectedIndex()"
              (click)="executeCommand(item)"
              (mouseenter)="selectedIndex.set(idx)"
              role="option"
              [attr.aria-selected]="idx === selectedIndex()">
              
              <div class="cmd-item-left">
                @if (item.coverImageUrl) {
                  <img 
                    [src]="item.coverImageUrl" 
                    [alt]="item.title + ' cover'" 
                    class="cmd-item-thumb" 
                    loading="lazy" />
                } @else {
                  <div class="cmd-item-category-pill" [class.games]="item.category === 'Games'">
                    {{ item.category }}
                  </div>
                }

                <div class="cmd-item-text">
                  <span class="cmd-item-title">{{ item.title }}</span>
                  @if (item.subtitle) {
                    <span class="cmd-item-subtitle">{{ item.subtitle }}</span>
                  }
                </div>
              </div>

              <div class="cmd-item-right">
                @if (item.price !== undefined) {
                  <span class="cmd-price-pill" [class.free]="item.price === 0">
                    {{ item.price === 0 ? 'FREE' : '$' + item.price.toFixed(2) }}
                  </span>
                }
                <svg class="cmd-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
              </div>
            </button>
          }
        }
      </div>

      <!-- Footer Quick Tips (Desktop Only) -->
      <div class="cmd-footer desktop-only">
        <div class="cmd-footer-tip">
          <kbd class="tip-kbd">↑</kbd>
          <kbd class="tip-kbd">↓</kbd>
          <span>to navigate</span>
        </div>
        <div class="cmd-footer-tip">
          <kbd class="tip-kbd">↵</kbd>
          <span>to select</span>
        </div>
        <div class="cmd-footer-tip">
          <kbd class="tip-kbd">esc</kbd>
          <span>to dismiss</span>
        </div>
      </div>
    </div>
  </div>
}
