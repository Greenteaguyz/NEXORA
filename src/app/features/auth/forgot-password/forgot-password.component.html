<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo-icon.svg" alt="NEXORA Icon" class="auth-icon">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your email and we'll simulate sending you a recovery link.</p>
    </div>

    @if (submitted) {
      <div class="success-box">
        <div class="success-title-row">
          <svg class="success-check-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <strong>Reset Link Dispatched</strong>
        </div>
        <span>If an account exists for <em>{{ email }}</em>, password reset instructions have been dispatched.</span>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email" class="form-label">Account Email</label>
          <input 
            id="email" 
            type="email" 
            name="email" 
            [(ngModel)]="email" 
            class="form-input" 
            placeholder="alice@nexora.io" 
            required>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading || !email">
          {{ loading ? 'Sending Link...' : 'Send Reset Link' }}
        </button>
      </form>
    }

    <div class="auth-footer">
      Remembered your password? <a routerLink="/login">Back to Sign In</a>
    </div>
  </div>
</div>
