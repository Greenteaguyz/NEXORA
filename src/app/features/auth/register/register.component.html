<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo-icon.svg" alt="NEXORA Icon" class="auth-icon">
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join NEXORA to download indie games and publish your creations.</p>
    </div>

    @if (errorMessage) {
      <div class="error-banner">{{ errorMessage }}</div>
    }

    <form (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="displayName" class="form-label">Display Name</label>
        <input 
          id="displayName" 
          type="text" 
          name="displayName" 
          [value]="displayName" 
          (input)="onDisplayNameChange($event)"
          class="form-input" 
          placeholder="CyberSamurai" 
          required>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          id="email" 
          type="email" 
          name="email" 
          [value]="email" 
          (input)="onEmailChange($event)"
          class="form-input" 
          placeholder="samurai@nexora.io" 
          required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-wrap">
          <input 
            id="password" 
            [type]="showPassword ? 'text' : 'password'" 
            name="password" 
            [value]="password" 
            (input)="onPasswordChange($event)"
            class="form-input password-input" 
            placeholder="••••••••" 
            required>
          <button 
            type="button" 
            class="btn-toggle-password" 
            (click)="togglePasswordVisibility()" 
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [title]="showPassword ? 'Hide password' : 'Show password'">
            @if (showPassword) {
              <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Creator Role Toggle (Task 2.6) -->
      <div class="creator-toggle-box">
        <div class="creator-toggle-info">
          <span class="toggle-title">Creator Account</span>
          <span class="toggle-desc">Enable Creator Studio to upload and sell games</span>
        </div>
        <label class="switch">
          <input type="checkbox" name="isCreator" [checked]="isCreator" (change)="onCreatorToggle($event)">
          <span class="slider"></span>
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || !email || !displayName">
        {{ loading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Log in here</a>
    </div>
  </div>
</div>
