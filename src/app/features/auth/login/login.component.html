<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo-icon.svg" alt="NEXORA Icon" class="auth-icon">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to access your game library and indie studio.</p>
    </div>

    <!-- 1-Click Demo Account Quick Selector -->
    <div class="demo-box">
      <div class="demo-box-label">
        <svg class="demo-bolt-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Instant 1-Click Persona Login</span>
      </div>
      <div class="demo-account-pills">
        <button 
          type="button" 
          class="demo-btn demo-persona-card" 
          [class.active]="email === 'alice@nexora.io'"
          (click)="fillDemo('alice@nexora.io')">
          <div class="persona-top-line">
            <span class="persona-name">Alice Vance</span>
            <span class="persona-badge creator">Creator</span>
          </div>
          <span class="persona-role-hint">Studio & Listings</span>
        </button>
        <button 
          type="button" 
          class="demo-btn demo-persona-card" 
          [class.active]="email === 'bob@nexora.io'"
          (click)="fillDemo('bob@nexora.io')">
          <div class="persona-top-line">
            <span class="persona-name">Bob Mercer</span>
            <span class="persona-badge buyer">Buyer</span>
          </div>
          <span class="persona-role-hint">Library & Wishlist</span>
        </button>
      </div>
    </div>

    @if (errorMessage) {
      <div class="error-banner">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          id="email" 
          type="email" 
          name="email" 
          [(ngModel)]="email" 
          class="form-input" 
          placeholder="welcome@nexora.io" 
          required>
        @if (email && !email.includes('@')) {
          <span class="inline-validation-hint warn">Please enter a valid email address with &#64;.</span>
        }
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="password" class="form-label">Password</label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <div class="password-input-wrap">
          <input 
            id="password" 
            [type]="showPassword ? 'text' : 'password'" 
            name="password" 
            [(ngModel)]="password" 
            class="form-input password-input" 
            placeholder="••••••••" 
            required>
          <button 
            type="button" 
            class="btn-toggle-password" 
            (click)="togglePasswordVisibility()" 
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [title]="showPassword ? 'Hide password' : 'Show password'">
            @if (showPassword) {
              <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg class="eye-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || !email">
        {{ loading ? 'Authenticating...' : 'Sign In' }}
      </button>
    </form>

    <div class="divider">or continue with</div>

    <div class="social-buttons">
      <button type="button" class="btn-social google" (click)="socialSignIn('google')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button type="button" class="btn-social apple" (click)="socialSignIn('apple')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.88c.67-.82 1.13-1.96 1-3.1-.97.04-2.14.65-2.83 1.46-.61.71-1.15 1.87-.99 2.98 1.08.08 2.15-.52 2.82-1.34z"/>
        </svg>
        Apple
      </button>
    </div>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
